<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Confirmed — Buyora | Computer Parts Store</title>
<link rel="icon" href="assets/favicon.png">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/mobile-nav.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="brand"><img src="assets/icon.png" alt="Buyora logo"><span class="brand-word">Buy<span>ora</span></span></a>
    <nav class="main-nav"><a href="index.html">Home</a><a href="shop.html">Shop</a><a href="about.html">About</a><a href="contact.html">Contact</a></nav>
  </div>
</header>

<section class="section" style="padding-top:90px;">
  <div class="container" style="max-width:620px;text-align:center;">
    <div class="empty-state glass-card">
      <div class="icon-circle" style="width:80px;height:80px;">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <h1 style="font-size:1.8rem;">Order confirmed!</h1>
      <p style="max-width:400px;margin:0 auto 6px;">Thanks for shopping with Buyora. A confirmation email is on its way to you.</p>
      <p style="font-weight:700;color:var(--navy);margin-bottom:26px;">Order #BYR-<span id="order-num"></span></p>
      <div style="display:flex;gap:14px;justify-content:center;flex-wrap:wrap;">
        <a href="shop.html" class="btn btn-primary">Continue shopping</a>
        <a href="index.html" class="btn btn-outline">Back to home</a>
      </div>
    </div>
  </div>
</section>

<footer class="site-footer">
  <div class="footer-bottom" style="border-top:none;"><span>© 2026 Buyora. All rights reserved.</span></div>
</footer>

<script src="js/cart.js"></script>
<script>
  const orderId = new URLSearchParams(window.location.search).get("orderId");
  document.getElementById("order-num").textContent = orderId
    ? String(orderId).padStart(6, "0")
    : Math.floor(100000 + Math.random()*899999);
</script>
</body>
</html>
