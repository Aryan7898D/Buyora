<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">Product — Buyora</title>
<link rel="icon" href="assets/favicon.png">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/mobile-nav.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="brand"><img src="assets/icon.png" alt="Buyora logo"><span class="brand-word">Buy<span>ora</span></span></a>
    <nav class="main-nav"><a href="index.html">Home</a><a href="shop.html" class="active">Shop</a><a href="about.html">About</a><a href="contact.html">Contact</a></nav>
    <form class="header-search" data-search-form><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input type="text" placeholder="Search for products..."></form>
    <div class="header-actions">
      <a href="login.html" class="icon-btn" aria-label="Account"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></a>
      <a href="cart.html" class="icon-btn" aria-label="Cart"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg><span class="cart-count" data-cart-count>0</span></a>
      <button class="nav-toggle" data-nav-open aria-label="Open menu"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
    </div>
  </div>
</header>

<div class="mobile-drawer" data-nav-drawer>
  <div class="mobile-drawer-panel">
    <button class="mobile-drawer-close" data-nav-close aria-label="Close menu"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    <nav><a href="index.html">Home</a><a href="shop.html">Shop</a><a href="about.html">About</a><a href="contact.html">Contact</a><a href="login.html">Account</a></nav>
  </div>
</div>

<div class="container">
  <div class="breadcrumb">
    <a href="index.html">Home</a><span class="sep">/</span>
    <a href="shop.html">Shop</a><span class="sep">/</span>
    <span class="current" id="crumb-name">Product</span>
  </div>
</div>

<section class="section-tight">
  <div class="container">
    <div class="product-detail" id="product-detail-root">
      <!-- filled by JS -->
    </div>

    <div class="pd-tabs">
      <div class="tab-headers">
        <button class="active" data-tab="desc">Description</button>
        <button data-tab="specs">Specifications</button>
        <button data-tab="reviews">Reviews</button>
      </div>
      <div class="tab-panel active" data-panel="desc" id="panel-desc"></div>
      <div class="tab-panel" data-panel="specs" id="panel-specs"></div>
      <div class="tab-panel" data-panel="reviews">
        <p>No reviews yet for this product.</p>
      </div>
    </div>
  </div>
</section>

<section class="section">
  <div class="container">
    <div class="section-head"><div><h2>You may also like</h2></div></div>
    <div class="product-grid" id="related-grid"></div>
  </div>
</section>

<footer class="site-footer">
  <div class="footer-top">
    <div class="footer-brand"><a href="index.html" class="brand"><img src="assets/icon.png" alt="Buyora logo"><span class="brand-word">Buy<span>ora</span></span></a><p>Shop more, live better.</p></div>
    <div class="footer-col"><h4>Shop</h4><ul><li><a href="shop.html">All products</a></li></ul></div>
    <div class="footer-col"><h4>Company</h4><ul><li><a href="about.html">About us</a></li><li><a href="contact.html">Contact</a></li></ul></div>
    <div class="footer-col"><h4>Stay updated</h4><form class="newsletter-mini" data-newsletter-form><input type="email" placeholder="Email address" required><button type="submit">Join</button></form></div>
  </div>
  <div class="footer-bottom"><span>© 2026 Buyora. All rights reserved.</span></div>
</footer>

<script src="js/products.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/cart.js"></script>
<script src="js/main.js"></script>
<script>
  let product, selectedColor, selectedSize, selectedImage = 0;

  async function initProductPage(){
    await tryLoadLiveProducts();
    const id = new URLSearchParams(window.location.search).get("id") || PRODUCTS[0].id;
    product = getProductById(id) || PRODUCTS[0];
    selectedColor = product.colors ? product.colors[0] : null;
    selectedSize = product.sizes ? product.sizes[0] : null;

    document.title = product.name + " — Buyora";
    document.getElementById("page-title").textContent = product.name + " — Buyora";
    document.getElementById("crumb-name").textContent = product.name;

    renderDetail();
    document.getElementById("panel-desc").innerHTML = `<p>${product.description}</p><p>Every Buyora order ships in recyclable packaging and includes a 30-day hassle-free return window, so you can shop with confidence.</p>`;
    document.getElementById("panel-specs").innerHTML = `
      <table style="width:100%;border-collapse:collapse;">
        <tbody>
          <tr><td style="padding:12px 0;border-bottom:1px solid var(--border-cyan);color:var(--navy);font-weight:700;width:180px;">Category</td><td style="padding:12px 0;border-bottom:1px solid var(--border-cyan);">${product.category}</td></tr>
          <tr><td style="padding:12px 0;border-bottom:1px solid var(--border-cyan);color:var(--navy);font-weight:700;">Availability</td><td style="padding:12px 0;border-bottom:1px solid var(--border-cyan);">${stockLabel(product)}</td></tr>
          <tr><td style="padding:12px 0;color:var(--navy);font-weight:700;">Shipping</td><td style="padding:12px 0;">Free over ₹1,999, arrives in 3–5 business days</td></tr>
        </tbody>
      </table>`;

    const related = PRODUCTS.filter(p => p.category === product.category && p.id !== product.id).slice(0,4);
    renderProductGrid(document.getElementById("related-grid"), related.length ? related : PRODUCTS.filter(p=>p.id!==product.id).slice(0,4));
  }

  function renderDetail(){
    const root = document.getElementById("product-detail-root");
    const oldPrice = product.oldPrice ? `<span class="price-old">${formatINR(product.oldPrice)}</span>` : "";
    root.innerHTML = `
      <div>
        <div class="pd-gallery-main"><img src="${product.images[selectedImage]}" alt="${product.name}" id="pd-main-img"></div>
        ${product.images.length > 1 ? `<div class="pd-thumbs">
          ${product.images.map((img,i) => `<button class="${i===selectedImage?'active':''}" data-thumb="${i}"><img src="${img}" alt="View ${i+1}"></button>`).join("")}
        </div>` : ""}
      </div>
      <div>
        <span class="pd-cat">${product.category}</span>
        <h1 class="pd-title">${product.name}</h1>
        <div class="pd-meta">
          ${product.reviews > 0 ? `<span class="stars">${renderStars(product.rating)}</span><span>${product.rating} (${product.reviews} reviews)</span>` : ""}
          <span class="stock-line ${isLowStock(product) ? "low" : "ok"}"><span class="dot"></span>${stockLabel(product)}</span>
        </div>
        <div class="pd-price-row"><span class="price-now">${formatINR(product.price)}</span>${oldPrice}</div>
        ${product.emi ? `<div class="pd-emi">or <b>${formatINR(product.emi)}</b>/month with EMI</div>` : ""}
        <p class="pd-desc">${product.description}</p>

        <div class="pd-options">
          ${product.colors ? `
          <div class="option-row">
            <label>Color</label>
            <div class="swatches">
              ${product.colors.map(c => `<button class="swatch ${c===selectedColor?'active':''}" style="background:${c}" data-color="${c}" aria-label="Color ${c}"></button>`).join("")}
            </div>
          </div>` : ""}
          ${product.sizes ? `
          <div class="option-row">
            <label>Size</label>
            <div class="size-pill-row">
              ${product.sizes.map(s => `<button class="size-pill ${s===selectedSize?'active':''}" data-size="${s}">${s}</button>`).join("")}
            </div>
          </div>` : ""}
          <div class="option-row">
            <label>Quantity</label>
            <div class="qty-stepper">
              <button type="button" id="qty-minus">−</button>
              <input type="text" id="qty-input" value="1" readonly>
              <button type="button" id="qty-plus">+</button>
            </div>
          </div>
        </div>

        <div class="pd-actions">
          <button class="btn btn-primary" id="add-to-cart-btn">Add to cart — ${formatINR(product.price)}</button>
          <button class="btn btn-outline" id="buy-now-btn">Buy now</button>
        </div>

        <div class="pd-features">
          ${product.features.map(f => `<div class="pd-feature"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg> ${f}</div>`).join("")}
        </div>
      </div>`;

    // Thumb switching
    root.querySelectorAll("[data-thumb]").forEach(btn => {
      btn.addEventListener("click", () => { selectedImage = Number(btn.dataset.thumb); renderDetail(); });
    });
    // Color switching
    root.querySelectorAll("[data-color]").forEach(btn => {
      btn.addEventListener("click", () => { selectedColor = btn.dataset.color; renderDetail(); });
    });
    // Size switching
    root.querySelectorAll("[data-size]").forEach(btn => {
      btn.addEventListener("click", () => { selectedSize = btn.dataset.size; renderDetail(); });
    });

    const qtyInput = document.getElementById("qty-input");
    document.getElementById("qty-minus").addEventListener("click", () => {
      qtyInput.value = Math.max(1, Number(qtyInput.value) - 1);
    });
    document.getElementById("qty-plus").addEventListener("click", () => {
      qtyInput.value = Math.min(product.stock, Number(qtyInput.value) + 1);
    });
    document.getElementById("add-to-cart-btn").addEventListener("click", () => {
      Cart.add(product.id, Number(qtyInput.value), { color: selectedColor, size: selectedSize });
      showToast(`Added ${qtyInput.value} × ${product.name} to your cart`);
    });
    document.getElementById("buy-now-btn").addEventListener("click", () => {
      Cart.add(product.id, Number(qtyInput.value), { color: selectedColor, size: selectedSize });
      window.location.href = "checkout.html";
    });
  }

  // Tabs
  document.querySelectorAll(".tab-headers button").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".tab-headers button").forEach(b => b.classList.remove("active"));
      document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
      btn.classList.add("active");
      document.querySelector(`[data-panel="${btn.dataset.tab}"]`).classList.add("active");
    });
  });

  initProductPage();
</script>
</body>
</html>
